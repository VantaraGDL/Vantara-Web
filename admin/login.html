<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Iniciar sesión | Vant’ara Admin</title><link rel="stylesheet" href="./css/admin.css"></head>
<body><main class="login"><h1>Vant’ara Admin</h1><p>Inicia sesión con tu cuenta de administrador.</p>
<p id="message" role="status" aria-live="polite"></p>
<form aria-describedby="message"><label for="email">Correo electrónico</label><input id="email" name="email" type="email" autocomplete="username" required>
<label for="password">Contraseña</label><input id="password" name="password" type="password" autocomplete="current-password" required>
<button type="submit" disabled>Iniciar sesión</button></form>
<p class="foot"><a href="../index.html">Volver a Vant’ara</a></p><noscript>Activa JavaScript para iniciar sesión.</noscript></main><script type="module" src="./js/app.js"></script></body></html>
