<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Editar producto | Vant’ara Admin</title><link rel="stylesheet" href="./css/admin.css"></head><body><main><header><h1>Editar producto</h1><nav><a href="./index.html">Dashboard</a> · <a href="./productos.html">Productos</a> · <a href="./login.html">Acceso</a></nav></header><p id="message" role="status" aria-live="polite">Verificando acceso…</p><section id="content" hidden><form id="editor" hidden><fieldset><legend>Datos del producto</legend><label for="name">Nombre</label><input id="name" name="name" type="text" required><label for="model">Modelo</label><input id="model" name="model" type="text" ><label for="color">Color (opcional)</label><input id="color" name="color" type="text" ><label for="brand_id">Marca</label><select id="brand_id" name="brand_id"></select><label for="category_id">Categoría</label><select id="category_id" name="category_id"></select><label for="price">Precio MXN (vacío = pendiente)</label><input id="price" name="price" type="number" min="0" max="9999999999.99" step="0.01"><label for="material">Material</label><input id="material" name="material" type="text" ><label for="description">Descripción</label><textarea id="description" name="description" rows="5"></textarea><label for="collection_id">Colección (opcional)</label><select id="collection_id" name="collection_id"></select><label class="check"><input type="checkbox" name="featured"> Destacado</label><label class="check"><input type="checkbox" name="published"> Publicado</label><h2>Stock por talla</h2><p>Vacío: pendiente. Cero: agotado. Solo se editan variantes existentes.</p><div id="variants"></div><button type="submit">Guardar cambios</button></fieldset></form></section><noscript>Activa JavaScript para acceder.</noscript></main><script type="module" src="./js/products.js"></script></body></html>
